<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tab Recorder · Microphone</title>
    <link rel="icon" href="icons/icon-32.png" />
    <style>
      /* Same faceplate as the popup: brushed aluminium on the recorder's black body. */
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.25rem; box-sizing: border-box;
        background: #232624; color: #2d302e;
        font: 18px/1.45 'DIN Condensed', 'Avenir Next Condensed', 'Arial Narrow', sans-serif; letter-spacing: 0.02em;
      }
      main {
        max-width: 26rem; padding: 1.5rem 1.5rem 1.25rem; border-radius: 8px;
        background:
          repeating-linear-gradient(90deg, rgb(255 255 255 / 0.18) 0 1px, transparent 1px 3px),
          linear-gradient(180deg, #d5d8d5, #c7cbc8 40%, #a4a9a6);
      }
      img { display: block; width: 56px; height: 56px; margin-bottom: 0.75rem; }
      h1 { font-size: 1.6rem; line-height: 1.1; margin: 0 0 0.5rem; }
      p { margin: 0 0 0.75rem; }
      #status { margin: 0; font-size: 1.1rem; }
    </style>
  </head>
  <body>
    <main>
      <img src="icons/icon-128.png" alt="" />
      <h1>Allow the microphone</h1>
      <p>Tab Recorder mixes your voice into recordings. Choose “Allow while visiting the site”, not “Allow this time”, so Chrome remembers it.</p>
      <p id="status">Waiting for your answer…</p>
    </main>
    <script type="module" src="mic.js"></script>
  </body>
</html>
